[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "geoimport"
version = "0.1.0"
description = "Konfigurierbare Import-Pipeline für Geodaten aus WFS- und CSV-Quellen nach PostgreSQL/PostGIS, mit Historisierung und Import-Bericht je Lauf"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Modular Ops GmbH" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.6,<3",
    "APScheduler>=3.10,<4",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
geoimport = "geoimport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoimport = ["migrationen/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "e2e: benötigt PostgreSQL/PostGIS (Umgebungsvariable DATABASE_URL)",
    "live: greift auf öffentliche Geodienste zu (nur manuell: pytest -m live)",
]
