# Start:          docker compose up -d --build
# Manueller Lauf: docker compose run --rm pipeline geoimport lauf
# Tests (E2E):    docker compose --profile test run --rm --build tests

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-geodaten}
      POSTGRES_USER: ${POSTGRES_USER:-geoimport}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - pgdaten:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pipeline:
    build:
      context: .
      target: betrieb
    image: geoimport:0.1
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoimport}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-geodaten}
      GEOIMPORT_ZEITPLAN: ${GEOIMPORT_ZEITPLAN:-0 3 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./config:/app/config:ro
      - ./berichte:/app/berichte
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-geoimport}:${POSTGRES_PASSWORD}@db:5432/geodaten_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdaten:
